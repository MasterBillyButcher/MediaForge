services:
  mediaforge:
    build: .
    image: mediaforge:latest
    container_name: mediaforge
    ports:
      - "3000:3000"
    environment:
      # SQLite database (created automatically on first boot)
      DATABASE_URL: file:/app/db/custom.db
      # Optional: point the browser directly at a separate playlist worker host
      # NEXT_PUBLIC_PLAYLIST_WORKER_URL: https://worker.example.com
    volumes:
      - mediaforge-db:/app/db
      - mediaforge-storage:/app/storage
      - mediaforge-playlist:/app/mini-services/playlist-worker/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/system/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3

volumes:
  mediaforge-db:
  mediaforge-storage:
  mediaforge-playlist:
