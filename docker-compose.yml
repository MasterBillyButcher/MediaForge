services:
  mediaforge:
    build: .
    image: mediaforge:latest
    container_name: mediaforge
    ports:
      - "3000:3000"
    environment:
      # One root for ALL persistent data (database, uploads/results, playlist jobs).
      # Mount a volume/disk at this path and you're done.
      MEDIA_DATA_DIR: /data
      # Optional: point the browser directly at a separate playlist worker host
      # NEXT_PUBLIC_PLAYLIST_WORKER_URL: https://worker.example.com
    volumes:
      - mediaforge-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/api/system/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 15s
      start_period: 40s
      retries: 3

volumes:
  mediaforge-data:
